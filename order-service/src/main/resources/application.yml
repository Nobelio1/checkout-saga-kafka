server:
  port: ${PORT:8081}

spring:
  application:
    name: order-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ordenes}
    username: ${DB_USER:orden_svc}
    password: ${DB_PASSWORD:orden_pass}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ordenes}
    user: ${DB_USER:orden_svc}
    password: ${DB_PASSWORD:orden_pass}

  webflux:
    problemdetails:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: pe.estudio.checkout.contratos

    listener:
      ack-mode: record

checkout:
  outbox:
    intervalo-ms: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    pe.estudio: INFO
    org.apache.kafka: WARN
